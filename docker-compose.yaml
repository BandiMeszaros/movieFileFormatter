services:
  movie-file-formatter:
    build: .
    container_name: movie-file-formatter
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/downloads}
      MOVIE_OUTPUT: ${MOVIE_OUTPUT:-/movies}
      STATE_DIR: ${STATE_DIR:-/state}
    # Unhealthy if a mounted folder is missing or the scan loop stops updating
    # its heartbeat (HEARTBEAT_MAX_AGE_SECONDS, default 1800).
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Change the host folders by editing `source` (in Coolify: Storages tab).
    # The env vars above must point at (or inside) the `target` paths.
    volumes:
      -
        type: bind
        source: /srv/media/downloads/complete
        target: /downloads
      -
        type: bind
        source: /srv/media/media
        target: /movies
      -
        type: bind
        source: /home/andras/config/fileformatter
        target: /state
